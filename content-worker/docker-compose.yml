services:
  content-worker:
    build: .
    env_file:
      - /var/www/bardasht-nextjs/.env
      - .env
    restart: unless-stopped
    environment:
      DATABASE_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /var/www/bardasht-nextjs/uploads:/app/site-uploads

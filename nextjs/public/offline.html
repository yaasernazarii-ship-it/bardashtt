<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1b1b1b">
  <title>بدون اتصال | خانواده برداشت</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f7f5;color:#1b1b1b;font-family:Tahoma,Arial,sans-serif}.card{width:min(440px,100%);text-align:center;background:#fff;border:1px solid #e5e5e0;border-radius:22px;padding:34px 24px;box-shadow:0 10px 35px rgba(0,0,0,.06)}img{width:88px;height:88px;border-radius:22px}h1{font-size:1.25rem;margin:18px 0 8px}p{color:#666;line-height:2;margin:0 0 20px}button{border:0;border-radius:12px;background:#1b1b1b;color:#fff;padding:11px 22px;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img src="/pwa-192.png" alt="خانواده برداشت">
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>برای دیدن اطلاعات تازه و ورود به پنل، اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.</p>
    <button type="button" onclick="location.reload()">تلاش دوباره</button>
  </main>
</body>
</html>
